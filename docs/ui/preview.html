<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>投资政策工作台 · 界面预览</title><style>/* Investment policy workspace — sober institutional blue, paper white, restrained vermilion. */
:root {
  --navy:#142e4c;
  --navy-deep:#10253e;
  --blue:#245e98;
  --ink:#20344d;
  --muted:#738297;
  --line:#e5eaf0;
  --paper:#fff;
  --bg:#f3f5f8;
  --red:#b4524d;
  --gold:#b09564;
  --radius:9px;
  --shadow:0 3px 16px #17324f04
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  color:var(--ink);
  background:var(--bg);
  font:14px/1.65 "Noto Sans CJK SC","Microsoft YaHei","PingFang SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased
}
a {
  color:var(--blue);
  text-decoration:none
}
button,input,select,textarea {
  font:inherit
}
button,a,input,select,summary {
  touch-action:manipulation
}
a:hover {
  color:#163e68
}
svg.icon {
  flex-shrink:0;
  vertical-align:middle
}
h1,h2,h3,p {
  margin:0
}
h1 {
  font-size:27px;
  line-height:1.4;
  font-weight:650;
  letter-spacing:.6px
}
h2 {
  font-size:16px;
  font-weight:650
}
h3 {
  font-size:14px;
  font-weight:550
}
input,select,textarea {
  color:var(--ink);
  background:white;
  border:1px solid #dbe2eb;
  border-radius:5px;
  padding:9px 12px;
  min-height:40px;
  max-width:100%
}
input::placeholder {
  color:#8995a5
}
input[type=checkbox] {
  min-height:0;
  accent-color:var(--blue)
}
input:focus,select:focus,textarea:focus {
  border-color:#4c7caa;
  outline:3px solid #245e9814
}
a:focus-visible,button:focus-visible,summary:focus-visible {
  outline:3px solid #a58043;
  outline-offset:4px
}
button {
  cursor:pointer
}
summary {
  cursor:pointer;
  color:var(--blue)
}
details[open] summary {
  margin-bottom:10px
}
.skip-link {
  position:fixed;
  left:12px;
  top:-80px;
  z-index:100;
  background:white;
  padding:10px 18px
}
.skip-link:focus {
  top:10px
}
.sidebar {
  position:fixed;
  inset:0 auto 0 0;
  width:230px;
  background:linear-gradient(170deg,#173453 0%,#11273f 75%);
  color:#ccd7e4;
  display:flex;
  flex-direction:column;
  z-index:20
}
.brand {
  display:flex;
  align-items:center;
  gap:14px;
  padding:32px 25px 35px;
  color:white
}
.brand:hover {

}
.brand strong {
  display:block;
  font-size:22px;
  letter-spacing:3px;
  line-height:1.45;
  font-weight:650
}
.brand small {
  font-size:10px;
  color:#adbed1;
  letter-spacing:1px
}
.brand-mark {
  height:37px;
  width:34px;
  display:flex;
  align-items:flex-end;
  gap:4px;
  transform:skewY(-9deg)
}
.brand-mark i {
  width:8px;
  background:#f4f6fa;
  height:24px
}
.brand-mark i:nth-child(2) {
  height:36px
}
.brand-mark i:nth-child(3) {
  height:29px;
  background:#bf6b61
}
.nav-caption {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:0 24px 14px;
  color:#8ea5bd;
  font-size:11px;
  letter-spacing:1px
}
.nav-caption span {
  font-size:8px;
  letter-spacing:1.6px;
  opacity:.7
}
.side-nav {
  padding:0 13px
}
.nav-item {
  position:relative;
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 17px;
  margin-bottom:7px;
  color:#becddd;
  font-size:13px;
  border:1px solid transparent;
  border-radius:5px;
  transition:background .18s
}
.nav-item .icon {
  width:18px;
  height:18px;
  opacity:.85
}
.nav-item:hover {
  color:#fff;
  background:#ffffff08
}
.nav-item.active {
  color:white;
  background:#ffffff10;
  border-color:#ffffff08
}
.nav-item.active:before {

  position:absolute;

  width:3px;
  height:22px;

}
.nav-indicator {
  margin-left:auto;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#d0b786
}
.sidebar-note {
  margin:auto 30px 34px;
  padding-top:60px
}
.note-line {
  display:block;
  width:26px;
  height:2px;
  background:#af9363;
  margin-bottom:16px
}
.sidebar-note p {
  font-size:22px;
  font-family:"Noto Serif CJK SC","STSong","SimSun",serif;
  line-height:1.8;
  letter-spacing:6px;
  color:#d8e0e9
}
.sidebar-note small {
  display:block;
  font-size:10px;
  color:#8ea3bb;
  margin-top:12px
}
.sidebar-foot {
  display:flex;
  align-items:center;
  gap:11px;
  margin:0 23px;
  padding:22px 0;
  border-top:1px solid #ffffff12;
  font-size:10px;
  color:#a3b5c9
}
.sidebar-foot small {
  display:block;
  color:#7c94ae;
  margin-top:3px
}
.workspace {
  margin-left:230px;
  min-height:100vh;
  display:flex;
  flex-direction:column
}
.workspace-bar {
  height:70px;
  background:white;
  border-bottom:1px solid var(--line);
  padding:0 36px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px
}
.breadcrumb {

  color:var(--muted);
  display:flex;
  align-items:center;
  gap:13px
}
.breadcrumb strong {
  font-weight:500;
  color:#31465f
}
.breadcrumb>span {
  color:#c3ccd6
}
.bar-meta {
  display:flex;
  gap:21px;
  align-items:center;
  color:#7c8999;
  font-size:11px
}
.edition {
  color:#8b6e43;
  background:#f7f3ec;
  border:1px solid #ece2d0;
  border-radius:3px;
  padding:3px 9px;
  font-size:10px
}
main {
  width:100%;
  max-width:1650px;
  margin:0 auto;
  padding:29px 36px 24px;
  flex:1;
  min-width:0
}
.page-heading {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px
}
.eyebrow {
  font-size:9px;
  letter-spacing:2px;
  color:#8391a2;
  font-weight:500;
  margin-bottom:6px
}
.page-heading p {
  font-size:12px;
  color:var(--muted);
  margin-top:7px
}
.heading-action {
  flex-shrink:0
}
.foot {
  padding:16px 36px 22px;
  color:#8b97a7;
  font-size:10px;
  display:flex;
  justify-content:space-between
}
.footer-sep {
  margin:0 9px
}
.hero {
  min-height:223px;
  background:linear-gradient(108deg,#173553,#244b6b);
  border-radius:var(--radius);
  position:relative;
  overflow:hidden;
  padding:27px 32px;
  color:#fff;
  display:flex;
  justify-content:space-between
}
.hero-copy {
  position:relative;
  z-index:1
}
.hero-label {
  font-size:10px;
  color:#c4d0db;
  letter-spacing:1.3px;
  display:flex;
  align-items:center;
  gap:9px
}
.hero-label i {
  height:5px;
  width:5px;
  border-radius:50%;
  background:#c7ae7e
}
.hero h2 {
  font-size:28px;
  line-height:1.55;
  letter-spacing:2px;
  margin:12px 0 8px;
  font-weight:550
}
.hero p {
  color:#bdcddd;
  font-size:11px
}
.hero a {
  display:flex;
  align-items:center;
  gap:17px;
  color:#e7edf3;
  font-size:11px;
  margin-top:17px;
  width:fit-content

.hero a .icon {

}

.hero-art>span {

}
.metrics-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:17px;
  margin:21px 0 27px
}
.metric {
  background:white;
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:19px 21px;
  box-shadow:var(--shadow)
}
.metric-top {
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#64758a;
  font-size:12px
}
.metric-icon {
  background:#f0f4f9;
  border-radius:6px;
  color:#6282a3;
  padding:6px;
  line-height:1
}
.metric-icon .icon {
  width:17px;
  height:17px
}
.metric-value {
  font-family:"Segoe UI",Arial,sans-serif;
  font-size:34px;
  line-height:1.4;
  font-weight:600;
  color:#1c3c60;
  margin:4px 0 1px;

}
.metric-value>span {

.metric-sub {

  color:#8b98a6
}
.metric.attention .metric-icon {

  color:#b56b5d
}
.metric.attention .metric-value {
  color:#a25449
}
.section-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px
}
.section-heading span {
  color:#8a97a6;
  font-size:10px
}
.category-grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:15px;
  margin-bottom:25px
}
.category-card {
  background:white;
  border:1px solid var(--line);
  border-radius:7px;
  padding:19px 17px;

  align-items:center;
  gap:11px;
  color:var(--ink);
  transition:border-color .2s,transform .2s
}
.category-card:hover {

}
.category-icon {
  color:#577b9f;
  background:#f0f4f8;
  border-radius:5px;
  display:flex;
  padding:8px
}
.category-icon .icon {
  width:19px;
  height:19px
}
.category-card h3 {
  font-size:12px;
  white-space:nowrap
}
.category-card h3 span {
  font-size:9px;
  margin-left:7px;
  color:#8693a3;
  font-weight:400
}
.category-card p {
  font-size:9px;
  color:#8a97a5;
  margin-top:5px;
  white-space:nowrap
}
.category-arrow {
  margin-left:auto;
  width:13px;
  height:13px;
  color:#a3afbb
}
.access .category-icon {
  color:#68867f;
  background:#eef4f2
}
.guarantee .category-icon {
  color:#9a835c;
  background:#f7f4ec
}
.incentive .category-icon {
  color:#a76e65;
  background:#f8f0ee
}
.dashboard-columns {
  display:grid;
  grid-template-columns:minmax(0,1.8fr) minmax(280px,1fr);
  gap:22px;
  align-items:start
}
.panel {
  background:white;
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  min-width:0;
  overflow:hidden
}
.panel-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:19px 23px;
  border-bottom:1px solid #edf0f4
}
.panel-heading h2 {
  font-size:14px;
  position:relative;
  padding-left:12px
}
.panel-heading h2:before {
  content:"";
  position:absolute;
  left:0;
  top:5px;
  width:3px;
  height:13px;
  background:#b55850;
  border-radius:2px
}
.text-link {
  font-size:10px;
  white-space:nowrap;
  color:#74879c
}
.text-link .icon {
  width:13px;
  height:13px;
  margin-left:4px
}
.policy-feed {
  padding:0 22px
}
.feed-row {
  display:flex;
  align-items:center;
  gap:13px;
  padding:20px 0;
  border-bottom:1px solid #eef1f5;
  color:var(--ink)
}
.feed-row:last-child {
  border-bottom:0
}
.feed-row:hover h3 {

}
.document-icon {
  background:#f2f5f9;
  color:#788fa6;
  padding:9px 8px;
  border-radius:5px;
  line-height:1;
  align-self:flex-start
}
.document-icon .icon {
  width:17px;
  height:17px
}
.feed-content {
  flex:1;
  min-width:0
}
.feed-content h3 {
  font-size:12px;
  line-height:1.8;

.feed-content p {

  color:#8c99a9;
  margin-top:8px
}
.feed-content p>span+span:before {
  content:"";
  display:inline-block;
  height:8px;
  width:1px;
  background:#dfe5ed;
  margin-right:10px
}
.feed-row .tag {

}
.dashboard-aside {

}
.review-callout {

  border-radius:var(--radius);

}
.review-callout:after {

  width:135px;
  height:135px;

.callout-top {

.review-callout p {

}
.review-callout .btn>span {

}
.review-callout .btn .icon {

}
.run-feed {
  padding:5px 22px 9px
}
.run-item {

  gap:11px;

}
.timeline-dot.ok {

}
.timeline-dot.failed {

}
.timeline-dot.partial {

}
.run-item>div {
  width:100%;
  min-width:0
}
.run-item p {
  display:flex;
  gap:10px;
  justify-content:space-between;
  font-size:9px;
  color:#8c98a6;
  margin-top:5px
}
.overview-strip {
  display:flex;
  align-items:center;
  gap:28px;
  padding:16px 3px 0;
  font-size:10px;
  color:#8492a3;
  flex-wrap:wrap
}
.overview-strip>div {
  display:flex;
  gap:9px;
  align-items:center
}
.overview-strip .icon {
  width:14px;
  height:14px
}
.overview-strip strong {
  font:500 13px "Segoe UI",sans-serif;
  color:#556c83
}
.overview-strip>p {
  margin-left:auto
}
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:9px 16px;
  border:1px solid #d5dee8;
  border-radius:5px;
  background:white;
  color:#4e627a;
  font-size:12px;
  min-height:39px;
  white-space:nowrap;
  font-weight:500;

.btn .icon {

  height:16px
}
.btn:hover {

  color:#27496b;
  border-color:#b7c8d9
}
.btn.primary {
  background:#245b90;
  border-color:#245b90;
  color:white;
  box-shadow:0 3px 6px #1e528514
}
.btn.primary:hover {

}
.btn.ok {
  background:#f0f6f3;
  color:#48795f;
  border-color:#ccdfd5
}
.btn.warn {
  background:#faf1ed;
  color:#a46948;
  border-color:#ead7c9
}
.btn.sm {

}
.tag,.chip {
  display:inline-block;
  font-size:10px;
  line-height:1.8;
  padding:2px 8px;
  border-radius:3px;
  white-space:nowrap;
  background:#edf2f8;
  color:#587898;
  font-weight:400
}
.tag.warn {
  background:#faf3e7;
  color:#9b7a41
}
.tag.bad {
  background:#faeeed;
  color:#ad645e
}
.tag.ok {

  color:#548772
}
.chip {
  margin:3px 5px 0 0
}

}
.status-pill.failed {
  color:#ad645e
}
.status-pill.failed>i,.dot.failed {

}
.status-pill.running {
  color:#3f77a9
}
.status-pill.running>i,.dot.running {

}
.empty-state {
  text-align:center;
  padding:48px 24px
}
.empty-icon {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#f2f5f9;
  color:#8b9fb4;
  margin-bottom:13px
}
.empty-icon .icon {

  height:25px
}
.empty-state h3 {
  color:#75879a;
  font-size:13px
}
.empty-state p {
  color:#98a3af;
  font-size:11px;
  margin-top:7px

.empty {

  color:#8b98a7;
  font-size:12px;
  text-align:center
}
.flash,.hint,.preview-banner {

  border:1px solid #dfe8f0;
  border-radius:6px;

  color:#657c92;

}

  color:#47785e;
  border-color:#cfe1d6
}

.preview-banner {

  font-size:12px;
  color:#657c92;

  color:#4c6b88;
  margin-bottom:3px
}

}
.dim,.meta,.id {
  color:#8b98a7;
  font-size:11px

lass=\"detail-toolbar\"><a class=\"text-link\" href=\"#policies\">← 返回政策资料库<\/a><span class=\"dim mono\">档案 #1 · v1<\/span><\/div>\n<header class=\"detail-head\"><div class=\"document-label\">投资政策资料 · 样例<\/div><h1>关于进一步做好基础设施领域不动产投资信托基金（REITs）试点项目申报工作的通知<\/h1>\n<div class=\"meta-line\"><span>文号：<b>发改投资〔2026〕312号<\/b><\/span><span>发文机关：未登记<\/span><span>发布日期：未登记<\/span><span>来源：本地样例（合成数据）<\/span><\/div>\n<div class=\"cats\"><span class=\"chip\">保障类<\/span><span class=\"chip\">激励约束类<\/span><span class=\"chip\">引导类<\/span><span class=\"tag warn\">待复核<\/span><\/div><\/header>\n<div class=\"document-layout\"><div class=\"document-main\"><section class=\"panel\"><div class=\"panel-heading\"><h2>政策正文<\/h2><a class=\"text-link\" href=\"#policies\" rel=\"noopener\" target=\"_blank\">查看来源原文 <svg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.65\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"m9 15 6-6m-8 5-2 2a3 3 0 0 0 4 4l4-4a3 3 0 0 0 0-4m4-2 2-2a3 3 0 0 0-4-4l-4 4a3 3 0 0 0 0 4\"><\/path>\n<\/svg><\/a><\/div><div class=\"document-body\"><pre class=\"content\">各省、自治区、直辖市及计划单列市、新疆生产建设兵团发展改革委：\n为贯彻落实党中央、国务院决策部署，进一步发挥基础设施领域不动产投资信托基金（REITs）对扩大有效投资的积极作用，引导社会资本参与基础设施项目建设，现就试点项目申报工作有关事项通知如下。\n一、重点支持交通、能源、市政、生态环保、仓储物流、园区基础设施、新型基础设施等领域项目。各地方发展改革委要结合本地区产业布局，做好项目储备和申报组织工作。\n二、申报项目应手续合规、权属清晰、运营稳定。项目投资规模、收益水平需符合相关要求，具体申报条件和材料清单按照《基础设施领域不动产投资信托基金（REITs）试点项目申报要求》执行。\n三、请各地于每季度末通过全国投资项目在线审批监管平台报送符合条件的项目清单，省级发展改革部门对申报材料进行初审把关。\n四、对纳入试点的项目，我委将会同有关部门在用地保障、资金支持等方面给予积极支持，并加强绩效考核和监督管理，对存在违规行为的项目实行退出机制。<\/pre><\/div><\/section>\n<section class=\"panel\"><div class=\"panel-heading\"><h2>附件与原件<\/h2><span class=\"dim sm\">0 项<\/span><\/div>\n<p class=\"inline-empty\">该记录未登记附件。<\/p><\/section>\n<\/div>\n<aside class=\"document-aside\"><section class=\"panel review-card\"><div class=\"panel-heading\"><h2>分类与复核<\/h2><\/div><div class=\"review-body\"><p class=\"hint\">结合原文确认是否属于投资政策，并核对分类结果。<\/p>\n<div class=\"reason\"><b>判断理由<\/b><p>规则命中：引导类:产业布局、引导社会资本；保障类:用地保障、资金支持、基金；激励约束类:绩效考核、监管、退出机制<\/p><\/div>\n<form action=\"#\" class=\"review-form\" method=\"post\" onsubmit=\"return false;\"><div class=\"review-primary\"><button class=\"btn primary\" disabled=\"\" name=\"action\" title=\"静态预览，请启动工作台体验此功能\" value=\"confirm\">确认采纳<\/button><button class=\"btn warn\" disabled=\"\" name=\"action\" title=\"静态预览，请启动工作台体验此功能\" value=\"reject\">剔除非政策<\/button><\/div><div class=\"review-adjust\"><h3>调整政策分类<\/h3><div class=\"checkbox-grid\"><label class=\"chk\"><input checked=\"\" disabled=\"\" name=\"categories\" title=\"静态预览，请启动工作台体验此功能\" type=\"checkbox\" value=\"guide\"/>引导类<\/label><label class=\"chk\"><input disabled=\"\" name=\"categories\" title=\"静态预览，请启动工作台体验此功能\" type=\"checkbox\" value=\"access\"/>准入类<\/label><label class=\"chk\"><input checked=\"\" disabled=\"\" name=\"categories\" title=\"静态预览，请启动工作台体验此功能\" type=\"checkbox\" value=\"guarantee\"/>保障类<\/label><label class=\"chk\"><input checked=\"\" disabled=\"\" name=\"categories\" title=\"静态预览，请启动工作台体验此功能\" type=\"checkbox\" value=\"incentive\"/>激励约束类<\/label><\/div><button class=\"btn\" disabled=\"\" name=\"action\" title=\"静态预览，请启动工作台体验此功能\" value=\"adjust\">保存分类调整<\/button><\/div><\/form>\n<p class=\"hint below-panel\">命中类别过多（≥3类混杂），需人工确认 <\/p><details class=\"model-trace\"><summary>查看分类方式<\/summary><p class=\"hint\">方式：rule<br/>模型：rule-v2<\/p><\/details><\/div><\/section>\n<section class=\"panel\"><div class=\"panel-heading\"><h2>来源与处理记录<\/h2><\/div><div class=\"trace-body\"><div class=\"trace-item\"><p>本地样例（合成数据）<\/p><a href=\"#policies\" rel=\"noopener\" target=\"_blank\">查看来源页面 <svg aria-hidden=\"true\" class=\"icon\" fill=\"none\" height=\"20\" stroke=\"currentColor\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-width=\"1.65\" viewbox=\"0 0 24 24\" width=\"20\">\n<path d=\"m9 15 6-6m-8 5-2 2a3 3 0 0 0 4 4l4-4a3 3 0 0 0 0-4m4-2 2-2a3 3 0 0 0-4-4l-4 4a3 3 0 0 0 0 4\"><\/path>\n<\/svg><\/a><
