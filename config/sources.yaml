    note: "2026-09-09 真实源验证：栏目列表(script 内嵌 recordset 记录)发现 + 详情 div.TRS_Editor 解析入库成功；CDATA 列表解析为 ListPageParser 通用能力。已新增 nextgroup 分组翻页适配；2026-09-11在线两组发现138条；抽样详情解析待修复，未宣称历史全量。"
