    include: ["/art/"]          # 新路径 /col/.../art/YYYY/art_<hex>.html 与旧路径 /art/YYYY/M/D/art_<colid>_<id>.html 均含 /art/
    detail_url_pattern: "/art_[0-9a-z_]+[.]html$"
    max_pages: 40               # 每页 15 条翻页直至空页自动停止；实测 26 页有数据、第 27 页空即停，去重 387 条（2026-06→2020-01 发布），上限留余量
    note: "已接通动态列表全量翻页（单元构建接口 paramJson pageNo/pageSize，空页自停，含新旧 art 路径），2026-09-09 真实源验证 387 条/27 页；接口参数随栏目页动态读取，不硬编码。详见 VALIDATION.md。"

