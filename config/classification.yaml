# 政策分类规则配置
version: scope-v3

# 任务书明确口径；争议边界保持待复核，不把建议冒充业务确认。
scope:
  definition: 对投资项目的方向、准入、要素供给、激励或全过程管理产生实质作用的政策条款。
  objects: [投资项目, 建设项目, 工程建设, 固定资产, 重大项目, 重大工程, 基础设施, 产业布局, 产业结构调整, 鼓励类, 市场准入负面清单, 中央预算内投资, 专项债券]
  actions: [适用, 应当, 必须, 不得, 实行, 规定, 支持, 保障, 鼓励, 核准, 备案, 审批, 监管, 评价, 追究, 给予, 补助, 奖励, 布局, 倾斜, 安排, 明确]
  pending_boundaries:
    - 综合文件只有少量项目条款，暂保留候选，待业务确认整篇收录标准。
    - 一般经营电价、企业环保约束没有直接项目条款时，不自动推断投资相关性。
    - 征求意见稿单独标记，不能作为现行正式政策自动通过。
  category_principle: 按条款作用多标签；每个类别分别提供原文证据。资金申报条件不等于项目准入，只有涉及项目能否建设或审批核准备案的条件才标准入。

# 四类分类 + 是否投资类政策判断。供规则分类器使用；LLM 分类时该文件内容
# 也会作为"业务口径提示词"注入，保证两种模式口径一致。
#
# 使用原则：
# 1) 先判"是不是要收的文件"，再判"四类中的哪一类"。
# 2) 类别按"条款实际作用"判断，不是按标题关键词一刀切。
# 3) 交叉样例（如同时涉及准入与保障）写进 boundary_cases，规则命中则标记待复核。

relevance:
  # 判断是否"投资项目政策"。仅用于候选召回；不按命中数量直接确认为相关。
  keywords_include:
    - "投资"
    - "项目"
    - "备案"
    - "核准"
    - "审批"
    - "专项资金"
    - "中央预算内投资"
    - "基础设施"
    - "重大工程"
    - "企业投资项目"
    - "固定资产"
  exclude_types: ["会议", "人事", "任免", "公示名单", "采购公告", "招标公告", "解读"]

categories:
  guide:            # 引导类：明确投资方向、产业布局、鼓励领域
    name: 引导类
    keywords:
      - "支持方向"
      - "重点领域"
      - "鼓励发展"
      - "产业布局"
      - "发展导向"
      - "发展规划"
      - "产业导向目录"
      - "区域布局"
      - "引导社会资本"
      - "鼓励类"
    evidence_hint: 用于判断文件对投资方向/产业布局的引导作用

  access:           # 准入类：规定项目能否进入以及前置条件
    name: 准入类
    keywords:
      - "核准"
      - "备案管理"
      - "审批权限"
      - "前置条件"
      - "市场准入"
      - "负面清单"
      - "节能审查"
      - "环境影响评价"
    evidence_hint: 用于判断项目准入、核准备案与前置条件

  guarantee:        # 保障类：土地、资金、信贷等要素及配置支持
    name: 保障类
    keywords:
      - "要素保障"
      - "用地保障"
      - "资金支持"
      - "信贷支持"
      - "融资支持"
      - "基金"
      - "专项债券"
      - "能耗指标保障"
    evidence_hint: 用于判断要素与资源配置保障安排

  incentive:        # 激励约束类：奖补、优惠、监管、绩效评价和责任要求
    name: 激励约束类
    keywords:
      - "奖补"
      - "补贴"
      - "税收优惠"
      - "绩效考核"
      - "综合评价"
      - "监管"
      - "惩戒"
      - "退出机制"
      - "责任追究"
      - "全过程监管"
      - "绩效评价"
      - "后评价"
      - "价格支持"
    evidence_hint: 用于判断奖补优惠、监管考核与责任约束

# 交叉/易混样例：写入后可被规则和 LLM 共同参考，命中即倾向待复核
boundary_cases:
  - title_hint: "能耗双控"
    note: 规定项目能耗准入条件→准入类；安排能耗指标保障→保障类。须看条款实际作用。
  - title_hint: "中央预算内投资管理办法"
    note: 资金供给→保障；资金绩效监管→激励约束。资金申请资格不直接等于项目准入，须有建设前置门槛条款。


doc_types:
  # 文件类型识别，供正文/入库记录
  formal: ["通知", "意见", "办法", "规划", "方案", "规定", "决定", "条例"]
  notice: ["申报", "征集", "组织申报", "开展申报", "报送"]
  interpretation: ["解读", "问答", "一图读懂", "说明"]
  draft: ["征求意见稿", "公开征求意见"]
  approval: ["批复", "核准批复", "备案"]

audit:
  # 需要人工复核的情况
  need_review_if:
    - 命中多个类别且无主类
    - 命中边界样例关键词
    - LLM 置信度低于阈值
    - 疑似重复但内容不同
